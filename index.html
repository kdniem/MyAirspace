<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050607">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyAirspace">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>MyAirspace</title>
  <script src="js/pwa.js"></script>
  <script src="js/styles.js"></script>
  <!-- style and theme before first paint: styles + config + theme set data-theme and the colour tokens on <html> -->
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="radar"></canvas>

    <header id="top">
      <div class="brand">
        <div class="brand-tag">MYAIRSPACE</div>
        <div id="place" class="brand-place"></div>
        <div id="title" class="brand-title"></div>
      </div>
      <div class="meta">
        <div id="clockbox" class="clockbox"><span id="clock" class="clock">--:--</span><span id="clock-tz" class="clock-tz">LT</span></div>
        <div id="utc" class="utc"></div>
        <div id="summary" class="summary">
          <span id="status-dot" class="dot"></span>
          <span id="summary-text">Verbinde…</span>
        </div>
        <!-- compact METAR, QNH and runway in use, filled by js/weather.js (hidden without a local airport) -->
        <div id="wx" class="wx" style="display:none">
          <div id="wx-metar"></div>
          <div id="wx-rwy"></div>
        </div>
      </div>
    </header>

    <section id="board" aria-live="polite">
      <div class="board-inner">
        <div class="cell cell-flight">
          <div class="lbl">FLUG</div>
          <div class="flightrow"><span id="b-logo" class="logo"></span><div id="b-flight" class="val led">------</div></div>
          <div id="b-airline" class="sub"></div>
        </div>
        <div class="cell cell-route">
          <div class="lbl">ROUTE</div>
          <div id="b-route" class="val led">--- &#8594; ---</div>
          <div id="b-badge" class="sub"></div>
        </div>
        <div class="cell cell-type">
          <div class="lbl">TYP</div>
          <div id="b-type" class="val led">----</div>
          <div id="b-reg" class="sub"></div>
        </div>
        <div class="cell cell-alt">
          <div id="b-alt-lbl" class="lbl">ALT</div>
          <div id="b-alt" class="val led">-----</div>
          <div id="b-vs" class="sub"></div>
        </div>
        <div class="cell cell-spd">
          <div class="lbl">GS</div>
          <div id="b-spd" class="val led">---</div>
          <div id="b-spd-sub" class="sub"></div>
        </div>
        <div class="cell cell-dist">
          <div class="lbl">DIST</div>
          <div id="b-dist" class="val led">--.-</div>
          <div id="b-dir" class="sub"></div>
        </div>
      </div>
      <div id="pager" class="pager"></div>
    </section>

    <section id="logview" aria-live="polite">
      <div class="lv-title">
        <div id="lv-heading" class="lv-heading led"></div>
        <div id="lv-date" class="lv-date"></div>
      </div>
      <div class="lv-table">
        <div class="lv-row lv-head">
          <div class="c c-time">ZEIT LT</div>
          <div class="c c-flight">FLUG</div>
          <div class="c c-airline">AIRLINE</div>
          <div class="c c-type">TYP</div>
          <div class="c c-route">ROUTE</div>
          <div id="lv-h-alt" class="c c-alt">ALT</div>
          <div class="c c-dist">DIST KM</div>
          <div class="c c-status">STATUS</div>
        </div>
        <div id="lv-rows" class="lv-rows"></div>
      </div>
      <div id="lv-stats" class="lv-stats"></div>
    </section>

    <footer id="attrib"></footer>

    <!-- special aircraft announcement (js/main.js announce) -->
    <div id="toast" class="toast"><span class="toast-mark"></span><span id="toast-label" class="toast-label"></span><span id="toast-text"></span></div>
  </div>
  <div id="dim"></div>

  <script src="data/geo-features.js"></script>
  <script src="data/airport-detail.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/hint.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/format.js"></script>
  <script src="js/airlines.js"></script>
  <script src="js/special.js"></script>
  <script src="js/pick.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/data.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/glyphs.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/airport.js"></script>
  <script src="js/board.js"></script>
  <script src="js/log.js"></script>
  <script src="js/views.js"></script>
  <script src="js/main.js"></script>
  <script src="js/fullscreen.js"></script>
</body>
</html>
