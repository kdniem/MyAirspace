name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # runtime dependencies (jsfive, pako) for the weather radar code; lockfile pinned, no install scripts needed
      - name: Install repo dependencies
        run: npm ci --ignore-scripts
      # Playwright lives outside the repo: install it there and point the tests at it
      - name: Install Playwright and Chromium
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Tests
        run: node tools/tests/run-all.mjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tools/tests/out/
          if-no-files-found: ignore
